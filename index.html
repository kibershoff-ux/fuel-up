<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fuel Up</title>
<meta name="theme-color" content="#14b8a6">
<meta name="description" content="Brylie's food and protein tracker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fuel Up">
<style>
:root{
  --bg:#f4fbfa; --card:#ffffff; --ink:#123; --muted:#5b6b78; --line:#e3ecef;
  --teal:#14b8a6; --teal-d:#0f8f82; --purple:#8b5cf6; --sun:#f59e0b; --pink:#ec4899; --sky:#0ea5e9;
  --soft-teal:#ccfbf1; --soft-purple:#ede9fe; --soft-sun:#fef3c7; --soft-pink:#fce7f3; --soft-sky:#e0f2fe;
  --r:18px; --shadow:0 2px 10px rgba(16,40,60,.07);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1a20; --card:#17252d; --ink:#e8f1f4; --muted:#9db0bb; --line:#24363f;
    --soft-teal:#123c38; --soft-purple:#2b2347; --soft-sun:#3b2f12; --soft-pink:#3d1a2d; --soft-sky:#12324a; --shadow:none; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:12px 16px calc(16px + env(safe-area-inset-top)) }
header.top{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 16px 4px;max-width:560px;margin:0 auto}
header.top h1{font-size:22px;margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin:12px 0;box-shadow:var(--shadow);border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.btn{background:var(--teal);color:#fff;border-radius:14px;padding:12px 16px;font-weight:600;min-height:46px}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--soft-teal);color:var(--teal-d)}
@media (prefers-color-scheme: dark){ .btn.ghost{color:#7ee8da} }
.btn.block{width:100%}
.btn.sm{padding:8px 12px;min-height:38px;font-size:14px}
.btn.purple{background:var(--purple)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;font-size:14px;font-weight:600}
.c-sun{background:var(--soft-sun)} .c-pink{background:var(--soft-pink)} .c-sky{background:var(--soft-sky)} .c-purple{background:var(--soft-purple)} .c-teal{background:var(--soft-teal)}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-height:46px}
input:focus,select:focus{outline:none;border-color:var(--teal)}
label.f{display:block;margin:10px 0 4px;font-weight:600;font-size:14px}
.rings{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ring{text-align:center}
.ring svg{width:100%;max-width:150px;height:auto}
.ring .big{font-size:24px;font-weight:800}
.ring .lbl{font-weight:700;margin-top:2px}
.msg{background:linear-gradient(135deg,var(--soft-teal),var(--soft-purple));border-radius:var(--r);padding:12px 14px;font-weight:600;margin:12px 0}
.daynav{display:flex;align-items:center;justify-content:space-between;margin:4px 0}
.daynav button{font-size:22px;padding:6px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.daynav .d{font-weight:700}
.meal h3{margin:4px 0 6px;font-size:16px;display:flex;justify-content:space-between}
.entry{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--line);width:100%;text-align:left}
.entry .em{font-size:24px;width:32px;text-align:center}
.entry .nm{flex:1;min-width:0}
.entry .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .kc{text-align:right;font-size:14px;white-space:nowrap}
.addmeal{color:var(--teal-d);font-weight:600;font-size:14px;padding:8px 4px}
@media (prefers-color-scheme: dark){ .addmeal{color:#7ee8da} }
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px}
.switch{position:relative;width:52px;height:30px;border-radius:99px;background:var(--line);transition:.2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--teal)} .switch.on::after{left:25px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.bottom button{flex:1;display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:600;color:var(--muted);padding:6px 0}
nav.bottom button .i{font-size:22px}
nav.bottom button.on{color:var(--teal-d)}
@media (prefers-color-scheme: dark){ nav.bottom button.on{color:#7ee8da} }
nav.bottom .plus .i{background:var(--teal);color:#fff;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:28px;margin-top:-18px;box-shadow:0 4px 12px rgba(20,184,166,.4)}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin:8px 0}
.tabs button{flex:1;padding:9px 4px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button.on{background:var(--soft-teal);color:var(--teal-d)}
@media (prefers-color-scheme: dark){ .tabs button.on{color:#7ee8da} }
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
.tile .em{font-size:26px}
.tile .n{font-size:13px;font-weight:600;line-height:1.2}
.tile .k{font-size:11px;color:var(--muted)}
.tile .star{position:absolute;top:4px;right:6px;font-size:12px}
.list .item{display:flex;align-items:center;gap:10px;padding:12px 4px;border-top:1px solid var(--line);width:100%;text-align:left}
.list .item:first-child{border-top:0}
.list .item .nm{flex:1;min-width:0}
.list .item .nm b{display:block;font-weight:600}
h2{font-size:18px;margin:16px 0 6px}
.sheet-bg{position:fixed;inset:0;background:rgba(10,20,30,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.stepper{display:flex;align-items:center;gap:12px;justify-content:center;margin:10px 0}
.stepper button{width:48px;height:48px;border-radius:50%;background:var(--soft-teal);font-size:24px;font-weight:700;color:var(--teal-d)}
.stepper .q{font-size:26px;font-weight:800;min-width:70px;text-align:center}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{padding:10px 6px;border-radius:12px;border:1.5px solid var(--line);font-weight:600;font-size:14px;min-width:70px}
.seg button.on{border-color:var(--teal);background:var(--soft-teal)}
.nutr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin:10px 0}
.nutr div{background:var(--bg);border-radius:12px;padding:8px}
.nutr b{display:block;font-size:20px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));background:#123;color:#fff;border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:92vw}
.toast{width:min(92vw,420px)} .toast>span{flex:1} .toast button{white-space:nowrap;padding:4px;color:#7ee8da;font-weight:700}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px;margin-top:8px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;color:var(--muted)}
.bar .b{width:100%;border-radius:8px 8px 4px 4px;background:var(--purple);min-height:3px}
.bar .b.hit{background:var(--teal)}
.win{display:flex;gap:10px;align-items:center;padding:8px 0}
.win .em{font-size:26px}
.water{display:flex;gap:6px;flex-wrap:wrap}
.water button{font-size:24px;opacity:.25;padding:2px}
.water button.on{opacity:1}
video{width:100%;border-radius:14px;background:#000;max-height:50vh;object-fit:cover}
#scanReader{width:100%}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--soft-pink);font-weight:600;white-space:nowrap}
.hidden{display:none!important}
.center{text-align:center}
a{color:var(--teal-d)}
.spin{display:inline-block;width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header class="top"><h1 id="hello">Fuel Up ⚽</h1><span id="streakBadge" class="chip c-sun hidden"></span></header>
<main id="app"></main>
<nav class="bottom" id="nav">
  <button data-v="today" class="on"><span class="i">🏠</span>Today</button>
  <button data-v="add" class="plus"><span class="i">＋</span>Add</button>
  <button data-v="week"><span class="i">📅</span>Week</button>
  <button data-v="me"><span class="i">⭐</span>Me</button>
</nav>
<script src="foods.js"></script>
<script src="app.js"></script>
</body>
</html>
